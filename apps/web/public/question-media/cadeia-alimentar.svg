<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Cadeia alimentar</title>
  <desc id="desc">Capim para gafanhoto para sapo para cobra. Setas indicam a transferência de matéria e energia.</desc>
  <rect width="800" height="200" fill="#fff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker></defs>
  <g stroke="#333" stroke-width="3" marker-end="url(#arrow)"><path d="M160 95H230"/><path d="M360 95H430"/><path d="M560 95H630"/></g>
  <g fill="#f0f8f3" stroke="#38724b" stroke-width="2"><rect x="30" y="60" width="120" height="70" rx="6"/><rect x="240" y="60" width="110" height="70" rx="6"/><rect x="440" y="60" width="110" height="70" rx="6"/><rect x="640" y="60" width="120" height="70" rx="6"/></g>
  <g font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#14291c"><text x="90" y="103">Capim</text><text x="295" y="103">Gafanhoto</text><text x="495" y="103">Sapo</text><text x="700" y="103">Cobra</text></g>
</svg>
