services:
  - type: web
    name: kuaa-tcc-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma db push --accept-data-loss && npx prisma db seed
    startCommand: node dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kuaa-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://kuaatcc.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        value: ""

databases:
  - name: kuaa-postgres
    databaseName: kuaa
    plan: free
