<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#35143E">
<title>Kuaa — sem conexão</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #24011f; color: #f6f4f2;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 1.35rem; margin: 20px 0 8px; }
  p { margin: 0 auto 24px; max-width: 30ch; opacity: .8; line-height: 1.5; }
  button { background: #f2b630; color: #24011f; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 1rem; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Sem internet agora</h1>
    <p>O Kuaa precisa de conexão para trazer suas questões. Assim que voltar, seu progresso continua de onde parou.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
